name: Comprobar y registrar version

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mega-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar y probar
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validar version
        id: version
        shell: pwsh
        run: |
          $megaVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($megaVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION debe usar mayor.menor.parche' }
          "value=$megaVersion" >> $env:GITHUB_OUTPUT
      - name: Restaurar dependencias fijadas
        run: dotnet restore MEGA.sln --locked-mode
      - name: Revisar scripts y dependencias
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter *.ps1 -Recurse | ForEach-Object {
            $megaTokens = $null; $megaErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$megaTokens, [ref]$megaErrors)
            if ($megaErrors.Count -gt 0) { throw ('Error de sintaxis en ' + $_.FullName) }
          }
          New-Item TestResults -ItemType Directory -Force | Out-Null
          dotnet list MEGA.sln package --vulnerable --include-transitive --format json | Set-Content TestResults/dependencias.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar la auditoria de dependencias.' }
          $megaAudit = Get-Content TestResults/dependencias.json -Raw | ConvertFrom-Json
          $megaFindings = @($megaAudit.projects | ForEach-Object { $_.frameworks } | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | ForEach-Object { $_.vulnerabilities } | Where-Object { $_ -and $_.severity -in @('High','Critical') })
          if ($megaFindings.Count -gt 0) { throw 'La auditoria detecto vulnerabilidades altas o criticas.' }
      - name: Verificar kanban y evidencias
        run: python tools/update_kanban.py --check
      - name: Compilar
        run: dotnet build MEGA.sln --configuration Release --no-restore --nologo
      - name: Ejecutar pruebas
        run: dotnet test MEGA.sln --configuration Release --no-build --no-restore --nologo --logger "trx;LogFileName=mega.trx" --results-directory TestResults
      - name: Preparar ejecucion Windows con entorno incluido
        shell: pwsh
        run: ./tools/build-distribution.ps1 -OutputDirectory TestResults
      - name: Conservar paquete de ejecucion
        uses: actions/upload-artifact@v7
        with:
          name: ejecucion-windows-${{ steps.version.outputs.value }}
          path: |
            TestResults/MEGA_Ejecucion_*.zip
            TestResults/MEGA_Ejecucion_*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Conservar resultado de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pruebas-${{ github.sha }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  etiquetar:
    name: Registrar version aprobada
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Crear etiqueta sin reemplazar versiones anteriores
        shell: pwsh
        env:
          MEGA_VERSION: ${{ needs.verificar.outputs.version }}
        run: |
          $megaTag = "v$env:MEGA_VERSION"
          $megaExisting = git tag --list $megaTag
          if ($megaExisting) { Write-Host "La etiqueta $megaTag ya se conserva en el historial."; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $megaTag -m "MEGA $megaTag - compilacion y pruebas aprobadas"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "refs/tags/$megaTag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
